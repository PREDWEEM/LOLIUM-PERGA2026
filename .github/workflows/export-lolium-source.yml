name: Aplicar adaptación común LOLIUM

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  adaptar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: agent/adaptacion-comun-lolium
          fetch-depth: 0

      - name: Aplicar adaptación validada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, subprocess
          encoded = ""
          patch = gzip.decompress(base64.b64decode(encoded))
          patch_path = Path("/tmp/adaptacion_comun.patch")
          patch_path.write_bytes(patch)
          subprocess.run(["git", "apply", "--check", str(patch_path)], check=True)
          subprocess.run(["git", "apply", str(patch_path)], check=True)
          PY

          python -m py_compile app_emergenciacombinado_core.py app_emergenciacombinado.py
          python - <<'PY'
          from pathlib import Path
          source = Path("app_emergenciacombinado_core.py").read_text(encoding="utf-8")
          assert source.count("def simular_emergencia_local") == 1
          assert source.count("def optimizar_parametros_hidricos_2d") == 1
          optimizer = source[source.index("def optimizar_parametros_hidricos_2d"):]
          assert "simular_emergencia_local(" in optimizer
          assert "rango_ke" not in optimizer
          assert "rango_cobertura" in optimizer
          assert "Exponente Kr (secado superficial)" in source
          assert "idx_pronostico = min(idx_hoy + 7" in source
          assert "inicio_simulacion" in source and "total_simulado" in source
          assert "value=0.0" in source
          assert "lag_dias=int(lag_emergencia_dias)" in source
          PY
          git diff --check

      - name: Publicar fuentes finales
        shell: bash
        run: |
          rm -f .github/workflows/export-lolium-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_emergenciacombinado_core.py app_emergenciacombinado.py .github/workflows/export-lolium-source.yml
          git commit -m "Unifica cálculo hídrico y validación Event-to-Event"
          git push origin HEAD:agent/adaptacion-comun-lolium
