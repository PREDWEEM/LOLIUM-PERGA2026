name: Aplicar bloqueo inicial de 25 dias
on:
  push:
    branches:
      - agent/bloqueo-emergencia-25-dias
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bloqueo-emergencia-25-dias
          fetch-depth: 0
      - name: Ajustar latencia y validar Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          import py_compile

          ROOT = Path('.')
          changed = []
          notes = []

          def starts(text):
              out = [0]
              for m in re.finditer(r'\n', text):
                  out.append(m.end())
              return out

          def node_span(node, offsets):
              return (offsets[node.lineno - 1] + node.col_offset, offsets[node.end_lineno - 1] + node.end_col_offset)

          def is_num(node, value):
              return isinstance(node, ast.Constant) and not isinstance(node.value, bool) and node.value == value

          def target_names(node):
              if isinstance(node, ast.Name): return [node.id]
              if isinstance(node, ast.Attribute): return [node.attr]
              if isinstance(node, (ast.Tuple, ast.List)):
                  result = []
                  for elt in node.elts: result.extend(target_names(elt))
                  return result
              return []

          def latency_name(name):
              upper = name.upper()
              return 'LATENCIA' in upper or 'BLOQUEO' in upper

          def collect(text, tree):
              offsets = starts(text)
              replacements = {}
              def add(node, new_value, reason):
                  if getattr(node, 'end_lineno', None) is not None:
                      replacements[node_span(node, offsets)] = (str(new_value), reason)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      names = [n for target in node.targets for n in target_names(target)]
                      if any(latency_name(n) for n in names) and is_num(node.value, 45): add(node.value, 25, 'constante de latencia')
                  elif isinstance(node, ast.AnnAssign):
                      if any(latency_name(n) for n in target_names(node.target)) and is_num(node.value, 45): add(node.value, 25, 'constante anotada de latencia')
                  elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.Lambda)):
                      positional = list(node.args.posonlyargs) + list(node.args.args)
                      defaults = [None] * (len(positional) - len(node.args.defaults)) + list(node.args.defaults)
                      for arg, default in zip(positional, defaults):
                          if default is not None and latency_name(arg.arg) and is_num(default, 45): add(default, 25, 'valor predeterminado de latencia')
                      for arg, default in zip(node.args.kwonlyargs, node.args.kw_defaults):
                          if default is not None and latency_name(arg.arg) and is_num(default, 45): add(default, 25, 'valor keyword de latencia')
                  elif isinstance(node, ast.Call):
                      for kw in node.keywords:
                          if kw.arg and latency_name(kw.arg) and is_num(kw.value, 45): add(kw.value, 25, 'argumento de latencia')
                  elif isinstance(node, ast.Compare):
                      segment = ast.get_source_segment(text, node) or ''
                      if re.search(r'Julian_days|dayofyear|\bJD\b|latencia|bloqueo', segment, re.I):
                          for operand in [node.left] + list(node.comparators):
                              if is_num(operand, 45): add(operand, 25, 'limite juliano de latencia')
                              elif is_num(operand, 46): add(operand, 26, 'primer dia posterior a latencia')
                  elif isinstance(node, ast.Dict):
                      pairs = list(zip(node.keys, node.values))
                      for key, value in pairs:
                          if isinstance(key, ast.Constant) and isinstance(key.value, str) and re.search(r'latencia|bloqueo', key.value, re.I) and is_num(value, 45): add(value, 25, 'parametro de latencia en diccionario')
                      labels = values = None
                      for key, value in pairs:
                          if isinstance(key, ast.Constant) and isinstance(key.value, str) and isinstance(value, (ast.List, ast.Tuple)):
                              if any(isinstance(e, ast.Constant) and isinstance(e.value, str) and re.search(r'latencia fija|bloqueo inicial', e.value, re.I) for e in value.elts): labels = value
                              if key.value.lower() in {'valor','valores','value','values'}: values = value
                      if labels is not None and values is not None:
                          for idx, elt in enumerate(labels.elts):
                              if isinstance(elt, ast.Constant) and isinstance(elt.value, str) and re.search(r'latencia fija|bloqueo inicial', elt.value, re.I) and idx < len(values.elts) and is_num(values.elts[idx], 45): add(values.elts[idx], 25, 'latencia exportada en reporte')
              return replacements

          def patch_lines(text):
              output, count = [], 0
              for line in text.splitlines(keepends=True):
                  original = line
                  if re.search(r'latencia|bloqueo', line, re.I):
                      line = re.sub(r'((?:latencia|bloqueo)[^\n]{0,90}?)\b45\b', lambda m: m.group(1) + '25', line, flags=re.I)
                      line = re.sub(r'\bprimeros\s+45\s+d[ií]as\b', 'primeros 25 días', line, flags=re.I)
                  if re.search(r'choque|ruptura|inicio|latencia', line, re.I): line = re.sub(r'\bJD\s*46\b', 'JD 26', line, flags=re.I)
                  count += line != original
                  output.append(line)
              return ''.join(output), count

          for path in sorted(ROOT.rglob('*.py')):
              if any(part.startswith('.') for part in path.parts) or '__pycache__' in path.parts: continue
              text = path.read_text(encoding='utf-8')
              try: tree = ast.parse(text, filename=str(path))
              except SyntaxError: continue
              replacements = collect(text, tree)
              new_text = text
              for (start, end), (replacement, reason) in sorted(replacements.items(), reverse=True):
                  new_text = new_text[:start] + replacement + new_text[end:]
                  notes.append(f'{path}: {reason}')
              new_text, textual_count = patch_lines(new_text)
              if textual_count: notes.append(f'{path}: {textual_count} texto(s) descriptivo(s)')
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  py_compile.compile(str(path), doraise=True)
                  changed.append(str(path))

          problems = []
          for path in sorted(ROOT.rglob('*.py')):
              if any(part.startswith('.') for part in path.parts) or '__pycache__' in path.parts: continue
              text = path.read_text(encoding='utf-8')
              try: tree = ast.parse(text, filename=str(path))
              except SyntaxError: continue
              if collect(text, tree): problems.append(f'{path}: quedan referencias funcionales a 45/46 dias')
              for line_no, line in enumerate(text.splitlines(), 1):
                  if re.search(r'((?:latencia|bloqueo)[^\n]{0,90}?)\b45\b', line, re.I): problems.append(f'{path}:{line_no}: texto de latencia aun indica 45')
                  if re.search(r'\bJD\s*46\b', line, re.I) and re.search(r'choque|ruptura|inicio|latencia', line, re.I): problems.append(f'{path}:{line_no}: inicio post-latencia aun indica JD 46')
          if problems: raise SystemExit('\n'.join(problems))
          print('Archivos modificados:', changed or 'ninguno; ya estaba en 25 dias')
          print('\n'.join(notes))
          PY
          rm .github/workflows/aplicar-bloqueo-25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta bloqueo inicial de emergencia a 25 dias"
          git push origin agent/bloqueo-emergencia-25-dias
